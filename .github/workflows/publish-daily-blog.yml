name: Publish Daily Blog Post

on:
  schedule:
    # 09:17 UTC, not 09:00 — GitHub Actions queues scheduled workflows in
    # a global queue, and top-of-hour crons (especially 00, 06, 09, 12,
    # 18 UTC) routinely run 60-120 min late or get silently dropped
    # entirely during peak load (e.g. 2026-05-11). Offset minutes are
    # the standard mitigation.
    - cron: '17 9 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  publish-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install @supabase/supabase-js ws github-slugger

      - name: Publish oldest draft blog post (all languages)
        id: publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -e

          # 1. Find the oldest draft EN post (by created_at)
          RESPONSE=$(curl -s \
            "${SUPABASE_URL}/rest/v1/blog_posts?language=eq.en&status=eq.draft&order=created_at.asc&limit=1&select=slug,title" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}")

          SLUG=$(echo "$RESPONSE" | jq -r '.[0].slug // empty')
          TITLE=$(echo "$RESPONSE" | jq -r '.[0].title // empty')

          if [ -z "$SLUG" ]; then
            echo "No draft posts remaining. All posts have been published!"
            echo "slug=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Publishing slug: $SLUG"
          echo "Title: $TITLE"
          # Expose the slug to downstream steps so IndexNow can scope its
          # submission to exactly 13 URLs (one per language) — using
          # --since=1 hour ago instead grabs every cell touched in that
          # window, which on busy days is enough URLs to trip Bing's
          # IndexNow abuse heuristics and return 403.
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

          # 2. Apply cross-links for all 13 languages
          if [ -f "cross_link_map.json" ]; then
            echo "Applying cross-links..."
            for LANG in en es fr de it da fi nl sv pt ko ja zh-cn; do
              node scripts/apply-crosslinks.mjs "$SLUG" "$LANG" || echo "  WARNING: cross-link application failed for $LANG (continuing)"
            done
          else
            echo "cross_link_map.json not found, skipping cross-links"
          fi

          # 3. Run the rot-signal gate to decide whether ko + zh-cn are safe
          #    to include in this slug's publish flip. The other 11 locales
          #    are always included.
          #
          # Why: the upstream MT pipeline produced systematically rotted
          # ko + zh-cn (calque H2 headers, brand-as-H2 like
          # "## mysterymaker.party와 ...", literal English-syntax ordering,
          # zh-cn cells averaging ~4.5k chars vs ~15.8k for European langs).
          # The previous fix blanket-excluded both languages; this gate
          # promotes a passing cell on a per-slug basis once it's healthy
          # (e.g. after regeneration), and continues to hold back rotted
          # ones — even cells that look fine at length but flunk a calque
          # check.
          #
          # Cross-links above DO still run for ko + zh-cn (content edit
          # only, no status change), so held-back drafts stay current.
          GATE_JSON=$(node scripts/check-rot-signals.mjs "$SLUG")
          echo "Rot-signal gate result:"
          echo "$GATE_JSON" | jq .

          LANGS="en,es,fr,de,it,da,fi,nl,sv,pt,ja"
          for LANG in ko zh-cn; do
            PASS=$(echo "$GATE_JSON" | jq -r --arg k "$LANG" '.[$k].pass')
            REASONS=$(echo "$GATE_JSON" | jq -r --arg k "$LANG" '.[$k].reasons | join("; ")')
            if [ "$PASS" = "true" ]; then
              LANGS="$LANGS,$LANG"
              echo "  $LANG: PASS — included"
            else
              echo "  $LANG: HOLD — $REASONS"
            fi
          done

          # GitHub Actions step summary so the rot-gate verdict shows up in
          # the run UI without having to scroll the log.
          {
            echo "## Rot-signal gate ($SLUG)"
            echo ""
            echo "| lang | present | pass | length | reasons |"
            echo "|------|---------|------|--------|---------|"
            echo "$GATE_JSON" | jq -r 'to_entries[] | "| \(.key) | \(.value.present) | \(.value.pass) | \(.value.length) | \(.value.reasons | join("; ")) |"'
            echo ""
            echo "**Published languages:** \`$LANGS\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # 4. PATCH only the languages that passed the gate.
          RESULT=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/blog_posts?slug=eq.${SLUG}&status=eq.draft&language=in.(${LANGS})" \
            -X PATCH \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"status\": \"published\", \"published_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")

          if [ "$RESULT" = "204" ]; then
            echo "Successfully published '$TITLE' (langs: $LANGS)"
          else
            echo "Failed to publish. HTTP status: $RESULT"
            exit 1
          fi

          # 4. Count remaining drafts
          REMAINING=$(curl -s \
            "${SUPABASE_URL}/rest/v1/blog_posts?language=eq.en&status=eq.draft&select=slug" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Prefer: count=exact" \
            -I | grep -i 'content-range' | grep -oP '\d+$' || echo "unknown")

          echo "Remaining draft posts: $REMAINING"

      - name: Regenerate llms.txt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/generate-llms-txt.mjs

      - name: Commit updated llms.txt
        # Run this immediately after regeneration, before any step that
        # could fail. Previously this lived after the IndexNow step, so
        # an IndexNow 403 would orphan the regenerated llms.txt.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet public/llms.txt; then
            echo "No changes to llms.txt"
          else
            git add public/llms.txt
            git commit -m "chore: regenerate llms.txt after daily publish"
            # Rebase onto any commits that landed on main while the workflow
            # was running (e.g. a parallel push by the human or another
            # workflow), then push. Without this, a non-fast-forward reject
            # orphans the regenerated llms.txt — see 2026-05-11 race.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push rejected (attempt $attempt) — rebasing and retrying"
              git pull --rebase origin main
            done
          fi

      - name: Apply Priority 5 TOC to just-published cells (idempotent)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Adds a numbered linked-anchor TOC at the top of every Priority 5
        # post (theme/setting/character/event slugs that aren't 5-X-themes,
        # how-to-fix, how-to-host, or best-comparison). Runs with --since to
        # restrict scope to cells touched in the last hour, i.e. just the
        # newly-published slug × 13 langs. Safe to re-run — idempotent skip
        # for cells with the locale TOC heading already present.
        run: |
          SINCE=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-1H +%Y-%m-%dT%H:%M:%SZ)
          node scripts/apply-p5-tocs.mjs --since="$SINCE"

      - name: Submit just-published URLs to IndexNow (Bing)
        if: steps.publish.outputs.slug != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Submits the just-published slug × 13 languages = 13 URLs so
        # Bing/Yandex/Seznam/Naver index within minutes rather than waiting
        # on sitemap polling. Google does not consume IndexNow.
        #
        # Uses the slug from the publish step rather than --since=1 hour
        # ago: a content-edit pass that touches many rows would otherwise
        # push hundreds of URLs in a single batch and trip Bing's IndexNow
        # abuse heuristics (HTTP 403). Slug-scoped is always exactly 13.
        run: node scripts/submit-indexnow.mjs --slug="${{ steps.publish.outputs.slug }}"

      - name: Submit sitemap to Google Search Console
        if: steps.publish.outputs.slug != ''
        env:
          GSC_SITE_URL: https://www.mysterymaker.party/
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        # Pings GSC to recrawl sitemap.xml after each daily publish.
        # Required because (a) Google does not consume IndexNow and
        # (b) sitemap re-fetch on Google's own schedule can lag days.
        # Submission is idempotent — calling it daily is safe.
        # Requires the GSC_SERVICE_ACCOUNT_JSON repo secret + the service
        # account being added as Owner/Full on the GSC property at
        # https://search.google.com/search-console (Settings → Users).
        # `continue-on-error: true` because GSC submission failure must not
        # block the publish — IndexNow handles Bing, this is Google bonus.
        continue-on-error: true
        run: node scripts/submit-sitemap-gsc.mjs
