name: Publish Daily Blog Post

on:
  schedule:
    # Runs at 9:00 AM UTC every day (5 AM ET / 2 AM PT)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  publish-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for cross_link_map.json)
        uses: actions/checkout@v4

      - name: Publish oldest draft blog post (all languages)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -e

          # 1. Find the oldest draft EN post (by created_at)
          RESPONSE=$(curl -s \
            "${SUPABASE_URL}/rest/v1/blog_posts?language=eq.en&status=eq.draft&order=created_at.asc&limit=1&select=slug,title" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}")

          SLUG=$(echo "$RESPONSE" | jq -r '.[0].slug // empty')
          TITLE=$(echo "$RESPONSE" | jq -r '.[0].title // empty')

          if [ -z "$SLUG" ]; then
            echo "No draft posts remaining. All posts have been published!"
            exit 0
          fi

          echo "Publishing slug: $SLUG"
          echo "Title: $TITLE"

          # 2. Apply EN cross-links from cross_link_map.json
          LINKS_APPLIED=0
          if [ -f "cross_link_map.json" ]; then
            # Check if this slug has insertions in the map
            HAS_INSERTIONS=$(jq -r --arg s "$SLUG" '.[$s].insertions // empty' cross_link_map.json)

            if [ -n "$HAS_INSERTIONS" ] && [ "$HAS_INSERTIONS" != "null" ]; then
              echo "Applying cross-links for EN content..."

              # Fetch current EN content
              EN_CONTENT=$(curl -s \
                "${SUPABASE_URL}/rest/v1/blog_posts?slug=eq.${SLUG}&language=eq.en&select=content" \
                -H "apikey: ${SUPABASE_SERVICE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
                | jq -r '.[0].content // empty')

              if [ -n "$EN_CONTENT" ]; then
                # Extract insertions and apply each one
                INSERTION_COUNT=$(jq -r --arg s "$SLUG" '.[$s].insertions | length' cross_link_map.json)

                for i in $(seq 0 $((INSERTION_COUNT - 1))); do
                  MATCH=$(jq -r --arg s "$SLUG" --argjson i "$i" '.[$s].insertions[$i].match_text' cross_link_map.json)
                  REPLACE=$(jq -r --arg s "$SLUG" --argjson i "$i" '.[$s].insertions[$i].replacement' cross_link_map.json)

                  if [ -n "$MATCH" ] && [ "$MATCH" != "null" ]; then
                    # Use node for reliable string replacement (handles special chars)
                    EN_CONTENT=$(node -e "
                      const content = process.argv[1];
                      const match = process.argv[2];
                      const replace = process.argv[3];
                      if (content.includes(match)) {
                        process.stdout.write(content.replace(match, replace));
                      } else {
                        process.stderr.write('WARNING: match_text not found: ' + match.substring(0, 60) + '...\n');
                        process.stdout.write(content);
                      }
                    " "$EN_CONTENT" "$MATCH" "$REPLACE")
                    LINKS_APPLIED=$((LINKS_APPLIED + 1))
                  fi
                done

                # Update EN content with cross-links applied
                if [ "$LINKS_APPLIED" -gt 0 ]; then
                  # Write content to temp file to avoid shell escaping issues
                  echo "$EN_CONTENT" > /tmp/en_content.txt
                  PAYLOAD=$(jq -n --rawfile content /tmp/en_content.txt '{content: $content}')

                  LINK_RESULT=$(curl -s -o /dev/null -w "%{http_code}" \
                    "${SUPABASE_URL}/rest/v1/blog_posts?slug=eq.${SLUG}&language=eq.en" \
                    -X PATCH \
                    -H "apikey: ${SUPABASE_SERVICE_KEY}" \
                    -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
                    -H "Content-Type: application/json" \
                    -H "Prefer: return=minimal" \
                    -d "$PAYLOAD")

                  if [ "$LINK_RESULT" = "204" ]; then
                    echo "Applied $LINKS_APPLIED cross-links to EN content"
                  else
                    echo "WARNING: Failed to update EN content with cross-links (HTTP $LINK_RESULT). Publishing without links."
                  fi
                  rm -f /tmp/en_content.txt
                fi
              fi
            else
              echo "No cross-links found for slug: $SLUG"
            fi
          else
            echo "cross_link_map.json not found, skipping cross-links"
          fi

          # 3. Update ALL language variants of this slug to published
          RESULT=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/blog_posts?slug=eq.${SLUG}&status=eq.draft" \
            -X PATCH \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"status\": \"published\", \"published_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")

          if [ "$RESULT" = "204" ]; then
            echo "Successfully published '$TITLE' in all languages ($LINKS_APPLIED EN cross-links applied)"
          else
            echo "Failed to publish. HTTP status: $RESULT"
            exit 1
          fi

          # 4. Count remaining drafts
          REMAINING=$(curl -s \
            "${SUPABASE_URL}/rest/v1/blog_posts?language=eq.en&status=eq.draft&select=slug" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Prefer: count=exact" \
            -I | grep -i 'content-range' | grep -oP '\d+$' || echo "unknown")

          echo "Remaining draft posts: $REMAINING"
