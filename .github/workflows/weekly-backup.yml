# Daily encrypted off-platform backup (2026-07-04; daily since 2026-07-05).
# Why: written 2026-07-05 when the project was on the Supabase FREE plan (no
# platform backups). The project has since been upgraded to Pro (platform
# backups exist); this export is kept for account-level failure cover.
# It exports the customer-critical tables daily and stores them as an
# ENCRYPTED GitHub artifact (30-day retention). The repo is PUBLIC, so
# encryption is mandatory — artifacts on public repos are downloadable by
# anyone. If the project ever upgrades to Pro (daily platform backups), this
# can drop back to weekly; keep it regardless for account-level failure cover.
#
# Setup (one-time): add a repo secret BACKUP_PASSPHRASE (Settings → Secrets
# and variables → Actions) with a long random passphrase, and store the same
# passphrase in your password manager. Without the passphrase the backups
# are unreadable — by design.
#
# Restore: download the artifact, then:
#   openssl enc -d -aes-256-cbc -pbkdf2 -in backup.tar.gz.enc -pass pass:<PASSPHRASE> | tar xz
# Each table is a .jsonl file (one row per line) any developer can re-import.
#
# Excluded: blog_posts (119 MB, regenerable from blog_map.xlsx + publish
# workflows), pinterest_pins (regenerable), staging/diagnostic tables.

name: Daily encrypted backup

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check passphrase configured
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::BACKUP_PASSPHRASE secret is not set — skipping backup. Add it under Settings → Secrets and variables → Actions (and keep a copy in your password manager)."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Export tables
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          mkdir -p backup
          TABLES="conversations messages mystery_packages mystery_characters character_assignments profiles cold_case_orders cold_case_identities guest_feedback mystery_feedback contact_messages followup_emails"
          # Page size kept small on purpose: mystery_characters rows carry full
          # round scripts (incl. branching variants), so a 1000-row select=*
          # page is ~18 MB and trips the PostgREST/gateway response ceiling →
          # HTTP 5xx → curl -f → exit 22. 200 keeps each page well under 4 MB.
          PAGE_SIZE=200
          SUMMARY="| Table | Rows |\n|---|---|\n"
          for t in $TABLES; do
            : > "backup/${t}.jsonl"
            # Keyset pagination (id > last id) instead of Range/OFFSET: OFFSET
            # re-scans every skipped wide row, which hit the Supabase statement
            # timeout (57014 -> HTTP 500) on mystery_characters at offset 600
            # on 2026-10-14 while the cron jobs were busy. A failed page is
            # retried with backoff and a halved page size before giving up.
            last=""
            size=$PAGE_SIZE
            attempt=0
            while :; do
              filter=""
              [ -n "$last" ] && filter="&id=gt.${last}"
              http=$(curl -s --max-time 120 -o page.json -w '%{http_code}' \
                -H "apikey: ${SUPABASE_SERVICE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
                "${SUPABASE_URL}/rest/v1/${t}?select=*&order=id&limit=${size}${filter}") || http=000
              if [ "$http" != "200" ]; then
                attempt=$((attempt+1))
                if [ "$attempt" -ge 5 ]; then
                  echo "::error::${t} export failed after last id '${last}': HTTP ${http}"
                  cat page.json
                  exit 1
                fi
                echo "::warning::${t} page failed (HTTP ${http}), retry ${attempt} with page size $((size>25 ? size/2 : size))"
                [ "$size" -gt 25 ] && size=$((size/2))
                sleep $((attempt*10))
                continue
              fi
              attempt=0
              count=$(jq 'length' page.json)
              [ "$count" -eq 0 ] && break
              jq -c '.[]' page.json >> "backup/${t}.jsonl"
              last=$(jq -r '.[-1].id' page.json)
              [ "$count" -lt "$size" ] && break
            done
            rows=$(wc -l < "backup/${t}.jsonl" | tr -d ' ')
            echo "${t}: ${rows} rows"
            SUMMARY="${SUMMARY}| ${t} | ${rows} |\n"
          done
          rm -f page.json
          printf '%b' "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          tar czf - -C backup . | openssl enc -aes-256-cbc -pbkdf2 -pass env:BACKUP_PASSPHRASE -out "backup-$(date -u +%Y-%m-%d).tar.gz.enc"
          rm -rf backup
          ls -la ./*.enc

      - name: Upload artifact
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-db-backup-${{ github.run_id }}
          path: "*.enc"
          retention-days: 30
