name: Sync Blog Map to Supabase

on:
  workflow_dispatch: # Manual trigger only — this is a one-time sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install exceljs @supabase/supabase-js

      - name: Sync blog_map.xlsx → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-blog-map.mjs

      - name: Summary
        run: echo "✅ Blog map sync complete. Check the logs above for details."
