name: Pinterest image generation (daily)

# Runs once a day, picks up any pinterest_pins rows with status='approved',
# calls Replicate (Flux 1.1 Pro) to generate the image, composites the pin via Sharp,
# uploads pin + raw + blog hero to Supabase storage, flips status to 'generated',
# and populates blog_posts.featured_image_url for the corresponding post.
#
# Pairs with:
#   - Edge Function fill-pinterest-creative (fills creative on draft rows → flips to 'approved')
#   - Make.com scenario (posts generated rows to Pinterest twice daily)
#
# Trigger: cron (daily 06:00 UTC = 07:00 CET / 08:00 CEST). Also workflow_dispatch.
# Replicate has no per-day quota like Imagen did; --limit 100 is a generous batch cap.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max rows to process this run (default 100)'
        required: false
        default: '100'
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run image generation
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '100' }}"
          node scripts/pinterest/run-generation.mjs --limit "$LIMIT"
