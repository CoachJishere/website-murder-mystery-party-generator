
# netlify.toml

[build]
  command = "npm ci && npm run build"
  publish = "dist"

# Specify Node.js version (using LTS version)
[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  # Explicitly disable pnpm and yarn
  NETLIFY_USE_PNPM = "false"
  NETLIFY_USE_YARN = "false"
  # Disable Corepack to prevent package manager auto-detection
  COREPACK_ENABLE = "0"
  # Force npm usage
  FORCE_NPM_USAGE = "true"
  # Extra npm configuration
  NPM_CONFIG_ENGINE_STRICT = "true"
  NPM_CONFIG_PACKAGE_LOCK = "true"
  NPM_CONFIG_PACKAGE_LOCK_ONLY = "false"
  # Disable pnpm
  DISABLE_PNPM = "true"
  PNPM_DISABLE = "true"

# 301 redirects for merged blog posts (non-survivors → survivors)
[[redirects]]
  from = "/blog/unique-medieval-murder-mystery-plot-ideas"
  to = "/blog/how-to-host-a-medieval-castle-murder-mystery-rule-your-realm-with-royal-intrigue"
  status = 301

[[redirects]]
  from = "/blog/unique-circus-murder-mystery-plot-ideas"
  to = "/blog/5-vintage-circus-murder-mystery-themes-step-into-the-big-top-of-intrigue"
  status = 301

[[redirects]]
  from = "/blog/unique-space-colony-murder-mystery-plots-explore-the-final-frontier-of-crime"
  to = "/blog/how-to-host-a-space-station-murder-mystery"
  status = 301

# Handle client-side routing for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Force HTTPS
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://cdn.gpteng.co https://www.clarity.ms https://*.clarity.ms https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co https://*.clarity.ms https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com;"

# Set cache headers for static assets
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
